<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --color-primary:        #56C7BB;
    --color-primary-hover:  #4EBCB1;
    --color-primary-light:  #EAF8F7;
    --color-primary-muted:  #A8E4DF;
    --color-bg:             #FFFFFF;
    --color-bg-hover:       #F8F7F7;
    --color-bg-muted:       #F0F0F0;
    --color-border:         #D7D7D7;
    --color-border-strong:  #B8B8B8;
    --color-text:           #5D5D5D;
    --color-text-strong:    #2E2E2E;
    --color-text-muted:     #9A9A9A;
    --font-sans:  "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif;
    --radius-md:   4px;
    --radius-lg:   8px;
    --radius-pill: 999px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    color: var(--color-text);
    background: var(--color-bg-hover);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    line-height: 1.85;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
  }

  .card {
    width: 100%;
    max-width: 600px;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  /* ── Banner ── */
  .banner {
    background: var(--color-primary);
    color: #fff;
    padding: 44px 40px 38px;
    position: relative;
  }
  .banner::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 4px;
    background: var(--color-primary-hover);
  }
  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.18em;
    font-weight: 500;
    text-transform: uppercase;
    opacity: 0.9;
    margin-bottom: 14px;
  }
  .banner h1 {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: 0.02em;
  }
  .banner .org {
    margin-top: 16px;
    font-size: 15px;
    opacity: 0.95;
  }

  /* ── Body ── */
  .body { padding: 36px 40px 40px; }

  .lede {
    font-size: 16px;
    line-height: 1.9;
    color: var(--color-text);
    margin-bottom: 32px;
  }

  /* ── Detail rows ── */
  .details {
    border-top: 1px solid var(--color-border);
  }
  .row {
    display: flex;
    gap: 20px;
    padding: 20px 0;
    border-bottom: 1px solid var(--color-border);
    align-items: baseline;
  }
  .row .label {
    flex: 0 0 64px;
    font-size: 13px;
    font-weight: 700;
    color: var(--color-text-muted);
    letter-spacing: 0.05em;
    line-height: 2.2;
  }
  .row .value { flex: 1; }
  .row .value .big {
    font-size: 26px;
    font-weight: 700;
    color: var(--color-text-strong);
    line-height: 1.3;
    letter-spacing: 0.01em;
  }
  .row .value .sub {
    font-size: 14px;
    color: var(--color-text-muted);
    margin-top: 2px;
  }

  .note-pill {
    display: inline-block;
    margin-top: 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--color-primary-hover);
    background: var(--color-primary-light);
    border-radius: var(--radius-pill);
    padding: 4px 14px;
  }

  .place-tag {
    display: inline-block;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    background: var(--color-primary);
    border-radius: var(--radius-md);
    padding: 2px 12px;
    letter-spacing: 0.04em;
    vertical-align: -2px;
  }

  /* ── Map ── */
  .map-block { margin-top: 32px; }
  .map-block h2 {
    font-size: 15px;
    font-weight: 700;
    color: var(--color-text-strong);
    margin-bottom: 14px;
    letter-spacing: 0.04em;
  }
  .map-frame {
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    overflow: hidden;
    line-height: 0;
  }
  .map-frame iframe {
    width: 100%;
    height: 280px;
    border: 0;
    display: block;
  }
  .map-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 14px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    padding: 9px 16px;
    border-radius: var(--radius-md);
    transition: background 150ms ease, color 150ms ease;
  }
  .btn-primary {
    background: var(--color-primary);
    color: #fff;
  }
  .btn-primary:hover { background: var(--color-primary-hover); }
  .btn-ghost {
    background: transparent;
    color: var(--color-primary-hover);
    border: 1px solid var(--color-border);
  }
  .btn-ghost:hover { background: var(--color-bg-hover); }

  .addr {
    font-size: 13px;
    color: var(--color-text-muted);
    margin-top: 16px;
    line-height: 1.7;
  }

  .venue-photo { margin-top: 18px; }
  .venue-photo img {
    width: 100%;
    display: block;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
  }
  .venue-photo figcaption {
    font-size: 13px;
    color: var(--color-text-muted);
    margin-top: 8px;
    letter-spacing: 0.02em;
  }

  /* ── Driving notice ── */
  .notice {
    margin-top: 32px;
    border: 1px solid var(--color-primary-muted);
    background: var(--color-primary-light);
    border-radius: var(--radius-md);
    padding: 18px 20px;
  }
  .notice .n-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--color-text-strong);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }
  .notice p {
    font-size: 14px;
    line-height: 1.8;
    color: var(--color-text);
  }
  .notice .quote {
    font-weight: 700;
    color: var(--color-primary-hover);
  }

  /* ── Footer ── */
  .foot {
    margin-top: 34px;
    padding-top: 22px;
    border-top: 1px solid var(--color-border);
    font-size: 13px;
    color: var(--color-text-muted);
    line-height: 1.8;
  }
  .foot strong { color: var(--color-text); font-weight: 700; }

  @media (max-width: 480px) {
    body { padding: 16px 0; }
    .card { border-radius: 0; border-left: none; border-right: none; }
    .banner { padding: 36px 24px 30px; }
    .banner h1 { font-size: 25px; }
    .body { padding: 28px 24px 32px; }
    .row { gap: 14px; }
    .row .label { flex-basis: 52px; }
  }

  @media print {
    body { background: #fff; padding: 0; }
    .card { border: none; max-width: 100%; }
    .btn { display: none; }
  }
</style>
</head>
<body>
  <div class="card">
    <header class="banner">
      <div class="eyebrow">INVITATION · 誠摯邀請</div>
      <h1>開南大學說明會資訊</h1>
    </header>

    <div class="body">
      <p class="lede">敬邀貴公司蒞臨本次說明會。為使會議準時開始，懇請於下列時間、地點報到，謝謝您的配合。</p>

      <div class="details">
        <div class="row">
          <div class="label">日期</div>
          <div class="value">
            <div class="big">6 月 3 日（星期三）</div>
          </div>
        </div>

        <div class="row">
          <div class="label">時間</div>
          <div class="value">
            <div class="big">13:00 – 15:00</div>
            <span class="note-pill">請盡量於 13:00 前抵達</span>
          </div>
        </div>

        <div class="row">
          <div class="label">地點</div>
          <div class="value">
            <div class="big"><span class="place-tag">B110</span> 會議廳</div>
            <div class="sub">開南大學・卓越樓（B110 位於卓越樓）</div>
          </div>
        </div>
      </div>

      <div class="map-block">
        <h2>交通與地圖</h2>
        <div class="map-frame">
          <iframe
            src="https://maps.google.com/maps?q=%E9%96%8B%E5%8D%97%E5%A4%A7%E5%AD%B8&z=16&output=embed"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            title="開南大學地圖"></iframe>
        </div>
        <div class="map-actions">
          <a class="btn btn-primary" href="https://www.google.com/maps/search/?api=1&query=%E9%96%8B%E5%8D%97%E5%A4%A7%E5%AD%B8" target="_blank" rel="noopener">在 Google 地圖開啟導航</a>
        </div>
        <p class="addr">33857 桃園市蘆竹區開南路一號　No.1 Kainan Road, Luzhu Dist., Taoyuan City</p>
        <figure class="venue-photo">
          <img src="https://general.knu.edu.tw/var/file/6/1006/img/102600233.jpg" alt="開南大學卓越樓" loading="lazy" referrerpolicy="no-referrer">
          <figcaption>卓越樓　B110 會議廳所在大樓</figcaption>
        </figure>
      </div>

      <div class="notice">
        <div class="n-title">開車入校提醒</div>
        <p>開車進入校門時，請向警衛告知「<span class="quote">國際事務洽公</span>」即可進入校園。</p>
      </div>

    </div>
  </div>
</body>
</html>
