<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', Helvetica, sans-serif;
  background: #f0faf9;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.card {
  background: #fff;
  border-radius: 20px;
  padding: 32px 36px 24px;
  text-align: center;
  box-shadow: 0 6px 32px rgba(85,189,178,.18);
  width: 300px;
}
.logo { width: 140px; margin-bottom: 24px; }

.spinner-wrap { margin-bottom: 14px; height: 38px; display: flex; align-items: center; justify-content: center; }
.spinner {
  width: 34px; height: 34px;
  border: 3px solid #e0f4f3;
  border-top-color: #55bdb2;
  border-radius: 50%;
  animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

#icon { font-size: 30px; display: none; }

#status {
  color: #444;
  font-size: 13px;
  line-height: 1.7;
  min-height: 42px;
  margin-bottom: 18px;
}

#link-area { display: none; margin-bottom: 16px; }
#link-area a {
  display: inline-block;
  background: #55bdb2;
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  padding: 8px 16px;
  border-radius: 8px;
}

.divider { border: none; border-top: 1px solid #f0f0f0; margin-bottom: 12px; }
.powered {
  color: #c0c0c0;
  font-size: 10px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
}
</style>
</head>

<script>
function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function onSuccess(result) {
  document.getElementById('spinner').style.display = 'none';
  var icon = document.getElementById('icon');
  icon.style.display = 'block';
  icon.textContent = '✅';
  setStatus('完成！');
  setTimeout(function() { google.script.host.close(); }, 1400);
}

function onError(err) {
  document.getElementById('spinner').style.display = 'none';
  var icon = document.getElementById('icon');
  icon.style.display = 'block';
  icon.textContent = '❌';
  setStatus('錯誤：' + (err.message || String(err)));
}

window.addEventListener('load', function() {
  google.script.run
    .withSuccessHandler(onSuccess)
    .withFailureHandler(onError)
    ["<?!= fnName ?>"]();
});
</script>
